<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>File &rarr; dataURL</title>
</head>
<body>
File &rarr; dataURL
<div><input type="file" oninput="megnyit();" id="f"></div>
<div><textarea readonly id="t" style="white-space: pre;"></textarea></div>
<script>
var f=document.getElementById("f");
var t=document.getElementById("t");
function megnyit() {
    f.disabled=true;
    t.disabled=true;
    t.value="";
    var fr=new FileReader();
    fr.onload=function() {
        t.value=fr.result;
        t.disabled=false;
        f.disabled=false;
    };
    fr.onerror=function() {
        console.error(fr.error);
        alert(fr.error);
        t.disabled=false;
        f.disabled=false;
    };
    fr.readAsDataURL(f.files[0]);
}
</script>
</body>
</html>
